name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Модель, хаб, командная строка и MCP. Интерфейс (headless Chrome) и раскладка с замерами скорости — локально.
      - run: node --test --test-reporter=spec test/app.test.mjs test/cli.test.mjs test/mcp.test.mjs
