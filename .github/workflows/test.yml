name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Model, hub, CLI and MCP. The UI (headless Chrome) and the layout tests with timing checks run locally.
      - run: node --test --test-reporter=spec test/app.test.mjs test/cli.test.mjs test/mcp.test.mjs
